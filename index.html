<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图片颜色分布生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #14120F; color: #EDE6DA;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 28px 16px 48px;
  }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9A9080; margin-bottom: 22px; }
  .hidden { display: none !important; }

  /* 上传区 */
  #drop {
    width: 640px; max-width: 94vw; min-height: 300px;
    border: 2px dashed #4A443A; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; cursor: pointer; transition: border-color .2s, background .2s;
  }
  #drop:hover, #drop.over { border-color: #BAA78B; background: rgba(186,167,139,.06); }
  #drop .icon { font-size: 44px; }
  #drop .t1 { font-size: 17px; font-weight: 600; }
  #drop .t2 { font-size: 13px; color: #8A8072; }
  #fileInput { display: none; }

  .status { margin-top: 18px; font-size: 14px; color: #B9AE9C; min-height: 20px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #6C543C;
    border-top-color: #EDE6DA; border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 结果区 */
  #result { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .toolbar { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; justify-content: center; }
  .btn {
    background: #2C2820; color: #F0E8D8; border: 1px solid #4A443A;
    padding: 10px 22px; border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: background .15s, transform .1s; display: flex; align-items: center; gap: 7px;
  }
  .btn:hover { background: #3A342A; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: #6C543C; border-color: #6C543C; }
  .btn.primary:hover { background: #7d6247; }

  .wrap { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: flex-start; max-width: 1100px; }
  .canvas-frame {
    width: 375px; max-width: 92vw; aspect-ratio: 3 / 4;
    position: relative; border-radius: 10px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    flex-shrink: 0; background: #201D10;
  }
  .block { position: absolute; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: filter .15s; }
  .block:hover { filter: brightness(1.15); z-index: 5; outline: 2px solid #fff; outline-offset: -2px; }
  .lbl { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.5;
    letter-spacing: .3px; text-shadow: 0 0 6px rgba(0,0,0,.25); pointer-events: none; }
  .panel { width: 460px; max-width: 92vw; }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #D8CDBB; }
  .li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px;
    cursor: pointer; transition: background .12s; }
  .li:hover { background: rgba(255,255,255,.08); }
  .sw { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .hx { font-family: "SF Mono", Consolas, monospace; font-size: 13px; width: 78px; }
  .bar-w { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
  .bar { display: block; height: 100%; border-radius: 3px; }
  .pc { font-size: 12.5px; color: #B9AE9C; width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  .tip { margin-top: 14px; font-size: 12px; color: #8A8072; line-height: 1.7; }
  .copied { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #2C2820; color: #F0E8D8; padding: 9px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.5); z-index: 99; }
  .copied.show { opacity: 1; }
</style>
</head>
<body>
  <h1>图片颜色分布生成器</h1>
  <div class="sub">上传图片 · 本地秒级分析 · 生成 3:4 颜色分布图（色块面积 = 颜色占比）</div>

  <div id="uploadArea">
    <div id="drop">
      <div class="icon">🖼️</div>
      <div class="t1">点击选择图片，或拖拽 / 粘贴到此处</div>
      <div class="t2">支持 PNG · JPG · WebP，全在浏览器本地完成，图片不会被上传</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="status" id="status"></div>
  <button class="btn" id="btnSelf2" style="margin-top:4px;">💾 下载本页 HTML 文件（可放到你自己的网页上）</button>

  <div id="result" class="hidden">
    <div class="toolbar">
      <button class="btn" id="btnNew">🔄 换一张图片</button>
      <button class="btn primary" id="btnPng">⬇️ 下载 PNG 分布图</button>
      <button class="btn" id="btnHtml">⬇️ 下载 HTML 报告</button>
      <button class="btn" id="btnSelf">💾 下载本页 HTML 源码</button>
    </div>
    <div class="wrap">
      <div class="canvas-frame" id="canvas"></div>
      <div class="panel">
        <h2>颜色代码与占比（点击可复制）</h2>
        <div id="legend"></div>
        <div class="tip">基于颜色量化聚类分析，相近色已自动合并；占比按像素统计归一化。</div>
      </div>
    </div>
  </div>

  <div class="copied" id="copied"></div>

<script>
'use strict';
const H_UNIT = 100 / 133.3333;
let currentColors = [], currentName = 'image';

const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('fileInput'), statusEl = $('status');

/* ---------- 上传交互 ---------- */
drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });
document.addEventListener('paste', e => {
  for (const item of e.clipboardData.items)
    if (item.type.startsWith('image/')) loadFile(item.getAsFile());
});
$('btnNew').addEventListener('click', () => {
  $('result').classList.add('hidden');
  $('uploadArea').classList.remove('hidden');
  statusEl.textContent = '';
  fileInput.value = '';
});

function loadFile(file) {
  currentName = (file.name || 'image').replace(/\.[^.]+$/, '');
  statusEl.innerHTML = '<span class="spinner"></span>正在分析颜色…';
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    // 让 UI 先刷新一帧再计算
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const t0 = performance.now();
      try {
        currentColors = analyze(img);
        const ms = Math.round(performance.now() - t0);
        render(currentColors);
        statusEl.textContent = '分析完成，耗时 ' + ms + 'ms';
        $('uploadArea').classList.add('hidden');
        $('result').classList.remove('hidden');
      } catch (err) {
        statusEl.textContent = '分析失败：' + err.message;
      }
      URL.revokeObjectURL(url);
    }));
  };
  img.onerror = () => { statusEl.textContent = '图片读取失败，请换一张试试'; };
  img.src = url;
}

/* ---------- 核心分析：采样 → 中位切分量化 → 合并相近色 ---------- */
function analyze(img) {
  const W = 200, H = Math.max(1, Math.round(200 * img.height / img.width));
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, W, H);
  const data = ctx.getImageData(0, 0, W, H).data;

  const pixels = [];
  for (let i = 0; i < data.length; i += 4) {
    if (data[i + 3] < 128) continue;          // 忽略透明像素
    pixels.push([data[i], data[i + 1], data[i + 2]]);
  }
  if (!pixels.length) throw new Error('图片没有有效像素');

  // 中位切分，得到 24 个主色
  const boxes = medianCut(pixels, 24);
  let colors = boxes.map(b => {
    const r = Math.round(b.sum[0] / b.n), g = Math.round(b.sum[1] / b.n), bl = Math.round(b.sum[2] / b.n);
    return { rgb: [r, g, bl], hex: hexOf(r, g, bl), pct: b.n / pixels.length * 100 };
  }).sort((a, b) => b.pct - a.pct);

  // 合并相近色（RGB 距离 < 38，按占比加权）
  const merged = [];
  for (const c of colors) {
    const m = merged.find(m => dist(m.rgb, c.rgb) < 38);
    if (m) {
      const t = m.pct + c.pct;
      m.rgb = [0, 1, 2].map(k => (m.rgb[k] * m.pct + c.rgb[k] * c.pct) / t);
      m.pct = t;
      m.hex = hexOf(...m.rgb.map(Math.round));
    } else merged.push({ ...c, rgb: [...c.rgb] });
  }
  // 占比过小的并入最近的大色
  const big = merged.filter(c => c.pct >= 1);
  const small = merged.filter(c => c.pct < 1);
  for (const s of small) {
    const near = big.length ? big.reduce((a, b) => dist(a.rgb, s.rgb) < dist(b.rgb, s.rgb) ? a : b)
                            : s;
    const t = near.pct + s.pct;
    near.rgb = [0, 1, 2].map(k => (near.rgb[k] * near.pct + s.rgb[k] * s.pct) / t);
    near.pct = t;
    near.hex = hexOf(...near.rgb.map(Math.round));
  }
  big.sort((a, b) => b.pct - a.pct);
  const total = big.reduce((s, c) => s + c.pct, 0);
  big.forEach(c => c.pct = c.pct / total * 100);
  return big;
}

function medianCut(px, k) {
  let boxes = [{ pixels: px, sum: [0, 0, 0], n: px.length,
                 min: [0, 0, 0], max: [255, 255, 255] }];
  const calc = b => {
    b.sum = [0, 0, 0]; b.n = b.pixels.length;
    b.min = [255, 255, 255]; b.max = [0, 0, 0];
    for (const p of b.pixels) for (let c = 0; c < 3; c++) {
      b.sum[c] += p[c];
      if (p[c] < b.min[c]) b.min[c] = p[c];
      if (p[c] > b.max[c]) b.max[c] = p[c];
    }
  };
  boxes.forEach(calc);
  while (boxes.length < k) {
    // 挑「像素数 × 通道跨度」最大的盒子切分
    let bi = -1, bs = -1;
    boxes.forEach((b, i) => {
      if (b.n < 2) return;
      const range = Math.max(...[0, 1, 2].map(c => b.max[c] - b.min[c]));
      const score = b.n * range;
      if (score > bs) { bs = score; bi = i; }
    });
    if (bi < 0) break;
    const b = boxes[bi];
    const ch = [0, 1, 2].reduce((a, c) => (b.max[c] - b.min[c]) > (b.max[a] - b.min[a]) ? c : a, 0);
    b.pixels.sort((p, q) => p[ch] - q[ch]);
    const mid = b.n >> 1;
    const b1 = { pixels: b.pixels.slice(0, mid) };
    const b2 = { pixels: b.pixels.slice(mid) };
    calc(b1); calc(b2);
    boxes.splice(bi, 1, b1, b2);
  }
  return boxes;
}

const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const hexOf = (r, g, b) => '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();

/* ---------- Squarified Treemap 布局 ---------- */
function treemap(items, W, H) {
  const out = [];
  (function rec(items, x, y, w, h) {
    if (!items.length) return;
    if (items.length === 1) { out.push({ ...items[0], x, y, w, h }); return; }
    const total = items.reduce((s, c) => s + c.pct, 0);
    let best = 1e9, split = 1;
    for (let i = 1; i < items.length; i++) {
      const a = items.slice(0, i).reduce((s, c) => s + c.pct, 0);
      if (a <= 0) continue;
      let worst = 0;
      if (w < h) {
        const rowW = w * a / total;
        for (const c of items.slice(0, i)) {
          const ch = h * c.pct / a;
          worst = Math.max(worst, rowW / ch, ch / rowW);
        }
      } else {
        const rowH = h * a / total;
        for (const c of items.slice(0, i)) {
          const cw = w * c.pct / a;
          worst = Math.max(worst, cw / rowH, rowH / cw);
        }
      }
      if (worst < best) { best = worst; split = i; }
    }
    const a = items.slice(0, split).reduce((s, c) => s + c.pct, 0);
    const frac = a / total, rest = items.slice(split);
    if (w < h) {
      const w1 = w * frac; let yy = y;
      for (const c of items.slice(0, split)) {
        const hh = h * c.pct / a;
        out.push({ ...c, x, y: yy, w: w1, h: hh }); yy += hh;
      }
      rec(rest, x + w1, y, w - w1, h);
    } else {
      const h1 = h * frac; let xx = x;
      for (const c of items.slice(0, split)) {
        const ww = w * c.pct / a;
        out.push({ ...c, x: xx, y, w: ww, h: h1 }); xx += ww;
      }
      rec(rest, x, y + h1, w, h - h1);
    }
  })(items, 0, 0, W, H);
  return out;
}

/* ---------- 渲染结果 ---------- */
function render(colors) {
  const blocks = treemap(colors, 100, 133.3333);
  const canvas = $('canvas');
  canvas.innerHTML = blocks.map(b => {
    const [r, g, bl] = b.rgb.map(Math.round);
    const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
    const tc = lum < 140 ? '#FFFFFF' : '#1A1A1A';
    const fontOk = b.w > 15 && b.h * H_UNIT > 8;
    const style = `left:${(b.x).toFixed(2)}%;top:${(b.y * H_UNIT).toFixed(2)}%;width:${b.w.toFixed(2)}%;height:${(b.h * H_UNIT).toFixed(2)}%;background:${b.hex}`;
    return `<div class="block" style="${style}" data-hex="${b.hex}" data-pct="${b.pct.toFixed(2)}">` +
           (fontOk ? `<span class="lbl" style="color:${tc}">${b.hex}<br>${b.pct.toFixed(1)}%</span>` : '') +
           `</div>`;
  }).join('');
  const maxPct = colors[0].pct;
  $('legend').innerHTML = colors.map(c =>
    `<div class="li"><span class="sw" style="background:${c.hex}"></span>` +
    `<span class="hx">${c.hex}</span>` +
    `<span class="bar-w"><span class="bar" style="width:${(c.pct / maxPct * 100).toFixed(1)}%;background:${c.hex}"></span></span>` +
    `<span class="pc">${c.pct.toFixed(2)}%</span></div>`).join('');
}

/* ---------- 点击复制 ---------- */
let copyTimer;
function toast(msg) {
  const el = $('copied'); el.textContent = msg; el.classList.add('show');
  clearTimeout(copyTimer); copyTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t);
  else { const ta = document.createElement('textarea'); ta.value = t;
         document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.block');
  if (b) { copyText(b.dataset.hex); toast('已复制 ' + b.dataset.hex + '（' + b.dataset.pct + '%）'); return; }
  const li = e.target.closest('.li');
  if (li) { const hx = li.querySelector('.hx').textContent; copyText(hx); toast('已复制 ' + hx); }
});

/* ---------- 下载本页 HTML 源码 ---------- */
const downloadSelf = async () => {
  let html = null;
  try {
    const res = await fetch(location.href);
    if (res.ok) html = await res.text();
  } catch (e) { /* file:// 等场景 fetch 不可用 */ }
  if (!html || !html.includes('颜色分布生成器')) {
    html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  }
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.download = '颜色分布生成器.html';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('HTML 文件已开始下载，可直接放到你的网页上使用');
};
$('btnSelf').addEventListener('click', downloadSelf);
$('btnSelf2').addEventListener('click', downloadSelf);

/* ---------- 下载 PNG ---------- */
$('btnPng').addEventListener('click', () => {
  const colors = currentColors;
  const cv = document.createElement('canvas');
  const S = 2;                                   // 2 倍清晰度
  cv.width = 1000 * S; cv.height = 1420 * S;
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  // 背景
  ctx.fillStyle = '#14120F'; ctx.fillRect(0, 0, 1000, 1420);
  // 标题
  ctx.fillStyle = '#EDE6DA'; ctx.textAlign = 'center';
  ctx.font = '600 30px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('图片颜色分布', 500, 62);
  ctx.fillStyle = '#9A9080'; ctx.font = '15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('色块面积 = 该颜色占画面比例 · 3 : 4 画幅', 500, 90);
  // treemap：3:4，宽 675 → 高 900
  const TW = 675, TH = 900, TX = (1000 - TW) / 2, TY = 130;
  const blocks = treemap(colors, TW, TH);
  for (const b of blocks) {
    const [r, g, bl] = b.rgb.map(Math.round);
    ctx.fillStyle = b.hex;
    ctx.fillRect(TX + b.x, TY + b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(TX + b.x + .5, TY + b.y + .5, b.w - 1, b.h - 1);
    const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
    ctx.fillStyle = lum < 140 ? '#FFFFFF' : '#1A1A1A';
    ctx.font = '600 15px "SF Mono",Consolas,monospace'; ctx.textAlign = 'center';
    if (b.w > 90 && b.h > 44) {
      ctx.fillText(b.hex, TX + b.x + b.w / 2, TY + b.y + b.h / 2 - 4);
      ctx.fillText(b.pct.toFixed(1) + '%', TX + b.x + b.w / 2, TY + b.y + b.h / 2 + 18);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.strokeRect(TX - .5, TY - .5, TW + 1, TH + 1);
  // 图例
  const LX = 163, LY = TY + TH + 40, rowH = 34, maxPct = colors[0].pct;
  ctx.textAlign = 'left';
  colors.forEach((c, i) => {
    const y = LY + i * rowH;
    ctx.fillStyle = c.hex;
    roundRect(ctx, LX, y, 24, 24, 6); ctx.fill();
    ctx.fillStyle = '#EDE6DA'; ctx.font = '14px "SF Mono",Consolas,monospace';
    ctx.fillText(c.hex, LX + 38, y + 17);
    ctx.fillStyle = 'rgba(255,255,255,.08)';
    roundRect(ctx, LX + 140, y + 9, 400, 7, 3.5); ctx.fill();
    ctx.fillStyle = c.hex;
    roundRect(ctx, LX + 140, y + 9, Math.max(7, 400 * c.pct / maxPct), 7, 3.5); ctx.fill();
    ctx.fillStyle = '#B9AE9C'; ctx.font = '13px "SF Mono",Consolas,monospace';
    ctx.textAlign = 'right';
    ctx.fillText(c.pct.toFixed(2) + '%', LX + 590, y + 17);
    ctx.textAlign = 'left';
  });
  // 底部说明
  ctx.fillStyle = '#8A8072'; ctx.font = '13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('基于颜色量化聚类分析 · 相近色已合并 · 占比按像素统计归一化', 500, 1400);
  // 下载
  const a = document.createElement('a');
  a.download = currentName + '-颜色分布.png';
  a.href = cv.toDataURL('image/png');
  a.click();
  toast('PNG 已开始下载');
});

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 下载 HTML 报告 ---------- */
$('btnHtml').addEventListener('click', () => {
  const colors = JSON.parse(JSON.stringify(currentColors));
  colors.forEach(c => { c.rgb = c.rgb.map(Math.round); });
  const report = buildReportHTML(colors, currentName);
  const blob = new Blob([report], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.download = currentName + '-颜色分布报告.html';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('HTML 报告已开始下载');
});

function buildReportHTML(colors, name) {
  const blocks = treemap(colors, 100, 133.3333);
  const blockHtml = blocks.map(b => {
    const [r, g, bl] = b.rgb.map(Math.round);
    const lum = 0.299 * r + 0.587 * g + 0.114 * bl;
    const tc = lum < 140 ? '#FFFFFF' : '#1A1A1A';
    const fontOk = b.w > 15 && b.h * H_UNIT > 8;
    return `      <div class="block" style="left:${b.x.toFixed(2)}%;top:${(b.y * H_UNIT).toFixed(2)}%;width:${b.w.toFixed(2)}%;height:${(b.h * H_UNIT).toFixed(2)}%;background:${b.hex}" data-hex="${b.hex}" data-pct="${b.pct.toFixed(2)}">` +
      (fontOk ? `<span class="lbl" style="color:${tc}">${b.hex}<br>${b.pct.toFixed(1)}%</span>` : '') + `</div>`;
  }).join('\n');
  const maxPct = colors[0].pct;
  const legendHtml = colors.map(c =>
    `      <div class="li"><span class="sw" style="background:${c.hex}"></span><span class="hx">${c.hex}</span>` +
    `<span class="bar-w"><span class="bar" style="width:${(c.pct / maxPct * 100).toFixed(1)}%;background:${c.hex}"></span></span>` +
    `<span class="pc">${c.pct.toFixed(2)}%</span></div>`).join('\n');
  return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name} · 图片颜色分布</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
    background: #14120F; color: #EDE6DA; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 28px 16px 48px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: #9A9080; margin-bottom: 22px; }
  .wrap { display: flex; gap: 32px; flex-wrap: wrap; justify-content: center; align-items: flex-start; max-width: 1100px; }
  .canvas-frame { width: 375px; max-width: 92vw; aspect-ratio: 3/4; position: relative;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 12px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  .block { position: absolute; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: filter .15s; }
  .block:hover { filter: brightness(1.15); z-index: 5; outline: 2px solid #fff; outline-offset: -2px; }
  .lbl { font-size: 11px; font-weight: 600; text-align: center; line-height: 1.5;
    letter-spacing: .3px; text-shadow: 0 0 6px rgba(0,0,0,.25); pointer-events: none; }
  .panel { width: 460px; max-width: 92vw; }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; color: #D8CDBB; }
  .li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 7px; cursor: pointer; transition: background .12s; }
  .li:hover { background: rgba(255,255,255,.08); }
  .sw { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
  .hx { font-family: "SF Mono",Consolas,monospace; font-size: 13px; width: 78px; }
  .bar-w { flex: 1; height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
  .bar { display: block; height: 100%; border-radius: 3px; }
  .pc { font-size: 12.5px; color: #B9AE9C; width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  .tip { margin-top: 14px; font-size: 12px; color: #8A8072; line-height: 1.7; }
  .copied { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #2C2820; color: #F0E8D8; padding: 9px 20px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none;
    box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .copied.show { opacity: 1; }
</style>
</head>
<body>
  <h1>图片颜色分布</h1>
  <div class="sub">色块面积 = 该颜色占画面比例 · 3 : 4 画幅 · 源图：${name}</div>
  <div class="wrap">
    <div class="canvas-frame">
${blockHtml}
    </div>
    <div class="panel">
      <h2>颜色代码与占比（点击可复制）</h2>
${legendHtml}
      <div class="tip">基于颜色量化聚类分析生成，相近色已合并；占比按像素统计归一化。</div>
    </div>
  </div>
  <div class="copied" id="copied"></div>
<script>
  let timer;
  function showToast(m){const e=document.getElementById('copied');e.textContent=m;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),1400);}
  function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t);else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}}
  document.addEventListener('click',e=>{
    const b=e.target.closest('.block');
    if(b){copyText(b.dataset.hex);showToast('已复制 '+b.dataset.hex+'（'+b.dataset.pct+'%）');return;}
    const li=e.target.closest('.li');
    if(li){const h=li.querySelector('.hx').textContent;copyText(h);showToast('已复制 '+h);}
  });
<\/script>
</body>
</html>`;
}
</script>


</body></html>
